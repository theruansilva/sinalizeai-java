spring.application.name=semaforo-api
server.port=${PORT:8080}

# Banco: H2 em memória por padrão; no Docker as variáveis apontam para o Postgres
spring.datasource.url=${DB_URL:jdbc:h2:mem:semaforo;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

spring.data.web.pageable.max-page-size=100
