spring.application.name=semaforo-api
server.port=${PORT:8080}

# Banco: H2 em memória por padrão; no Docker as variáveis apontam para o Postgres
spring.datasource.url=${DB_URL:jdbc:h2:mem:semaforo;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:false}

spring.data.web.pageable.max-page-size=100

# Mensagens do Bean Validation em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Segurança: segredo e origens vêm de variáveis de ambiente (nada sensível no repositório)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:PT8H}
cors.origins=${CORS_ORIGINS:*}

# Actuator: health e info públicos; metrics e caches só para ADMIN (ver SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true
management.info.java.enabled=true
info.app.nome=Sem\u00e1foro Inteligente API
info.app.descricao=Modo enchente e onda verde de evacua\u00e7\u00e3o - Global Solution FIAP 2026/2
info.app.versao=@project.version@

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
